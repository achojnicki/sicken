  author: IkuMiku96

custom_parameters:
  Shock:
    min: 0.0
    max: 1.0
    default: 0.0

  PosessedLook:
    min: 0.0
    max: 1.0
    default: 0.0

  SurpriseSign:
    min: 0.0
    max: 1.0
    default: 0.0

  MusicNotes:
    min: 0.0
    max: 1.0
    default: 0.0

  Sweat:
    min: 0.0
    max: 1.0
    default: 0.0

  RedCheeks:
    min: 0.0
    max: 1.0
    default: 0.0

actions:
  speak:
    parameters:
      MouthOpen:
        mode: divine
        generator: _generate_speak_range
        smoother: null
        smoother_alpha: 0.8
        data: 
          a: 30
          o: 30
          e: 30
          u: 5
          h: 10
          u: 10
          i: 15
          w: 8
          y: 20
          n: 3
          p: 0
          b: 0
          m: 0
          t: 5
          l: 5
          w: 5
          f: 7
          s: 15
          h: 15
          j: 14
          d: 15
          g: 20
          l: 10
          c: 15
          r: 7

  nod_yes:
    description: Noding with positive message
    parameters: 
      FaceAngleY:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 3000
        step: 400

  nod_no:
    description: Noding with negative message
    parameters:
      FaceAngleX:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 3000
        step: 400

  blink:
