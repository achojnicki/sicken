model:
  name: Miku Chibi Dayo~!
  model_id: a3f3ed7dba19431eafc3966a08101282
  author: IkuMiku96

custom_parameters:
  ShockSign:
    min: 0.0
    max: 1.0
    default: 0.0

  Shock:
    min: 0.0
    max: 1.0
    default: 0.0

  PosessedLook:
    min: 0.0
    max: 1.0
    default: 0.0


actions:
  speak:
    parameters:
      MouthOpen:
        mode: divine
        generator: _generate_speak_range
        data: 
          a: 45
          o: 38
          e: 40
          u: 5
          h: 10
          u: 18
          i: 15
          w: 8
          y: 20
          n: 3
          p: 0
          b: 0
          m: 0
          t: 10
          l: 5
          w: 5
          f: 7
          s: 15
          h: 15
          j: 14
          d: 15
          g: 20
          l: 10
          c: 15
          r: 7

  nod_yes:
    description: Noding with positive message
    parameters: 
      FaceAngleY:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 3000
        step: 400

  nod_no:
    description: Noding with negative message
    parameters:
      FaceAngleX:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 3000
        step: 400

  blink:
    description: Blink with both eyes
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 40
      
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 40

  wink_left_eye:
    description: Wink with left eye
    parameters:
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

  wink_left_eye_tilt:
    description: Wink with left eye with head tilt to the left side
    parameters:
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_left_range
        start: 0
        stop: 1500
        step: 200

  wink_right_eye:
    description: wink with right eye
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

  wink_right_eye_tilt:
    description: wink with right eye with head tilt to the right side
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_right_range
        start: 0
        stop: -1500
        step: 200

  tilt_head_left:
    description: Tilt head to left side
    parameters:
      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_left_range
        start: 0
        stop: 1500
        step: 200

  tilt_head_right:
    description: Tilt head to right side
    parameters:
      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_right_range
        start: 0
        stop: -1500
        step: 200

  angry_sign:
    description: Angry Sign
    parameters:
      FaceAngry:
        mode: divine
        generator: _generate_angry_range
        start: 0
        stop: 100
        step: 40

  shock:
    description: Shock making face darker and blue
    parameters:
      Shock:
        mode: divine
        generator: _generate_shock_range
        start: 0
        stop: 80
        step: 10

  shock_sign:
    description: Shock Sign just like in the anime when the "crown" like object is appearing next to the head.
    parameters:
      ShockSign:
        mode: divine
        generator: _generate_shock_sign_range
        start: 0
        stop: 100
        step: 10

  posessed_look:
    description: Look without any reflections of the light from the eye
    parameters:
      PosessedLook:
        mode: divine
        generator: generate_possessed_look_range
        start: 0
        stop: 100
        step: 10






