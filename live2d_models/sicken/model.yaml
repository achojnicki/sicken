actions:
  speak:
    parameters:
      MouthOpen:
        mode: divine
        generator: _generate_speak_range
        smoother: null
        smoother_alpha: 0.8
        data:
          q: 15
          w: 15
          e: 50
          r: 15
          t: 25
          y: 25
          u: 20
          i: 25
          o: 50
          p: 15
          a: 50
          s: 35
          d: 15
          f: 15
          g: 20
          h: 15
          j: 14
          k: 15
          l: 15
          z: 15
          x: 15
          c: 15
          v: 15
          b: 15
          n: 15
          m: 15

  nod_yes:
    description: Noding with positive message
    parameters:
      FaceAngleY:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 2000
        step: 200

  nod_no:
    description: Noding with negative message
    parameters:
      FaceAngleX:
        mode: divine
        generator: _generate_nod_range
        start: 0
        stop: 2000
        step: 200

  blink:
    description: Blink with both eyes
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 40
      
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 40

  wink_left_eye:
    description: Wink with left eye
    parameters:
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

  wink_left_eye_tilt:
    description: Wink with left eye with head tilt to the left side
    parameters:
      EyeOpenLeft:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_left_range
        start: 0
        stop: 3000
        step: 100

  wink_right_eye:
    description: wink with right eye
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

  wink_right_eye_tilt:
    description: wink with right eye with head tilt to the right side
    parameters:
      EyeOpenRight:
        mode: divine
        generator: _generate_wink_range
        start: 100
        stop: 0
        step: 20

      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_right_range
        start: 0
        stop: -3000
        step: 120

  tilt_head_left:
    description: Tilt head to left side
    parameters:
      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_left_range
        start: 0
        stop: 3000
        step: 120

  tilt_head_right:
    description: Tilt head to right side
    parameters:
      FaceAngleZ:
        mode: divine
        generator: _generate_tilt_right_range
        start: 0
        stop: -3000
        step: 120

  angry_sign:
    description: Angry Sign
    parameters:
      Angry:
        mode: divine
        generator: _generate_angry_range
        start: 10
        stop: 0
        step: 1

  shock_sign:
